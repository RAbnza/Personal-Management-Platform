name: salapiya
description: Salapiya native shell, interactive Overview and design gallery.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter_svg: 2.3.0
  flutter:
    sdk: flutter
  powersync: 2.5.0
  sqlite3: 3.8.0
  sqlite_async: 0.14.6
  supabase_flutter: 2.18.3
  flutter_secure_storage: 11.2.0
  cryptography: 2.9.0
  crypto: 3.0.7
  path_provider: 2.1.5
  path: 1.9.1
  app_links: 7.2.2
  file_picker: 13.2.0
  timezone: 0.11.2
  csv: 8.0.0

hooks:
  user_defines:
    sqlite3:
      source: sqlite3mc

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/source/
    - assets/branding/mark/
    - assets/branding/horizontal/
    - assets/branding/vertical/
    - assets/branding/display/
    - assets/fonts/nunitosans/OFL.txt
    - assets/fonts/geist/OFL.txt
    - assets/fonts/sourcesans3/OFL.txt
  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/nunitosans/regular.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/regular.ttf
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/sourcesans3/regular.ttf
