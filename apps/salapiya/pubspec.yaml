name: salapiya
description: Salapiya native shell, interactive Overview and design gallery.
publish_to: none
version: 0.1.0+1

environment:
  sdk: '>=3.13.5 <4.0.0'
  flutter: '>=3.47.7'

dependencies:
  flutter_svg: 2.3.0
  flutter:
    sdk: flutter

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/branding/source/
    - assets/branding/mark/
    - assets/branding/horizontal/
    - assets/branding/vertical/
    - assets/branding/display/
    - assets/fonts/nunitosans/OFL.txt
    - assets/fonts/geist/OFL.txt
    - assets/fonts/sourcesans3/OFL.txt
  fonts:
    - family: Nunito Sans
      fonts:
        - asset: assets/fonts/nunitosans/regular.ttf
    - family: Geist
      fonts:
        - asset: assets/fonts/geist/regular.ttf
    - family: Source Sans 3
      fonts:
        - asset: assets/fonts/sourcesans3/regular.ttf
