name: V1 acceptance
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: v1-${{ github.ref }}
  cancel-in-progress: true
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: personal_management
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mailpit:
        image: axllent/mailpit:v1.31.3
        ports: [8025:8025]
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24.21.0
      - run: npm install --global pnpm@12.9.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsx scripts/testing/prepare-ci.ts
      - run: pnpm db:provision:roles && pnpm db:setup:test && pnpm db:migrate:test && pnpm jobs:migrate:test
      - run: pnpm check
      - run: pnpm test --maxWorkers=1 --pool=threads
      - run: pnpm test:integration
      - run: pnpm db:verify:chain
      - run: pnpm db:verify:chain --upgrade
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser
      - run: pnpm verify:restore
        env:
          PMP_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: docker build --target web --tag pmp-v1-c5-web .
      - run: docker build --target worker --tag pmp-v1-c5-worker .
      - run: docker build --target backup --tag pmp-v1-c5-backup .
      - name: Verify restricted Linux runtime artifacts
        run: |
          export PMP_TEST_DOCKER_NETWORK=$(docker inspect --format '{{range $name, $value := .NetworkSettings.Networks}}{{$name}}{{end}}' "$PMP_TEST_POSTGRES_CONTAINER")
          export PMP_TEST_DOCKER_DATABASE_HOST=$(docker inspect --format '{{.Name}}' "$PMP_TEST_POSTGRES_CONTAINER" | cut -c 2-)
          pnpm verify:containers
        env:
          PMP_TEST_POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
      - run: pnpm audit --prod --audit-level high
